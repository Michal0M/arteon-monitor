name: Denný scrape VW Arteon inzerátov

on:
  schedule:
    # 6:00 UTC = 8:00 (zima) / 7:00 (leto) v Bratislave.
    # Ak chceš iný čas, uprav cron výraz - format: minúta hodina * * *
    - cron: "0 6 * * *"
  workflow_dispatch: {}  # umožní ručne spustiť beh z GitHub UI (tab "Actions")

permissions:
  contents: write  # potrebné, aby workflow mohol commitnúť späť DB a HTML

concurrency:
  group: daily-scrape
  cancel-in-progress: false  # nikdy neprerušuj bežiaci scrape, radšej počkaj

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # bezpečnostný strop - throttling + viac stránok môže trvať dlhšie
    steps:
      - name: Checkout repozitára
        uses: actions/checkout@v4

      - name: Nastaviť Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nainštalovať závislosti
        run: pip install -r requirements.txt

      - name: Spustiť scraper
        run: python scraper.py

      - name: Vygenerovať HTML stránku
        run: python render.py

      - name: Commitnúť a pushnúť zmeny (DB + HTML)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/listings.db docs/index.html
          git diff --staged --quiet && echo "Žiadne zmeny, nič necommitujem." || git commit -m "Denná aktualizácia inzerátov ($(date -u +%Y-%m-%d))"
          git push
